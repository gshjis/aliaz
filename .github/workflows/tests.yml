name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем локальные пакеты в editable-режиме (как в Dockerfile)
          pip install -e ./packages/config ./packages/database ./packages/auth ./packages/translator ./packages/schemas ./packages/api
          # Зависимости для тестов
          pip install "pytest>=9.1.1" "pytest-asyncio>=0.24,<0.25" "httpx>=0.27,<0.28"

      - name: Run tests
        run: pytest -q
