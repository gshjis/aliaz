# Docker Compose автоматически читает файл .env из этой директории
# для подстановки переменных (${VAR}) и (через env_file) для контейнеров.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aliaz}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aliaz}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Публикуем только на loopback: доступ к приложению — только через
    # хостовый nginx, который проксирует на 127.0.0.1:${PORT}.
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    env_file:
      - .env
    command: sh -c "python init_db.py && uvicorn packages.api.api.main:app --host $$HOST --port $$PORT"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PORT}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  frontend:
    build: ./frontend
    depends_on:
      - web
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
