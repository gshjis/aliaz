[tool.poetry]
name = "aliaz"
package-mode = false
version = "0.1.0"
description = ""
authors = ["gshjis <ilya.togan@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = {version = "^2.0.52", extras = ["asyncio"]}
uvicorn = "^0.52.3"
pydantic = "^2.13.4"
pydantic-settings = "^2.8.0"
fastapi = "^0.141.1"
asyncpg = "^0.31.0"
aiosqlite = "^0.22.1"
email-validator = "^2.0.0"
config = {path = "packages/config", develop = true}
database = {path = "packages/database", develop = true}
auth = {path = "packages/auth", develop = true}
translator = {path = "packages/translator", develop = true}
schemas = {path = "packages/schemas", develop = true}
api = {path = "packages/api", develop = true}
openai = "^3.3.0"
slowapi = "^0.1.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.11.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Остальные настройки (pytest, ruff, mypy, isort) остаются без изменений
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # FastAPI Depends() in function signatures is intentional
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_reexport = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# Тесты не требуют строгой типизации
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
