name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        # poetry подтянет совместимые версии pytest/pytest-asyncio
        # из dev-группы (pytest ^8.2.0, pytest-asyncio ^0.24.0)
        run: poetry install

      - name: Run tests
        run: poetry run pytest -q
